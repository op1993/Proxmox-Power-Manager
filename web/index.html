<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proxmox Power Manager</title><style>
body{font:16px system-ui;background:#101827;color:#edf2fa;max-width:760px;margin:40px auto;padding:0 18px}h1{font-size:27px}[hidden]{display:none!important}section{background:#1b293c;border-radius:12px;padding:20px;margin:18px 0}label{display:flex;justify-content:space-between;gap:12px;margin:14px 0;align-items:center}input{padding:9px;border-radius:7px;border:1px solid #53637c;background:#101827;color:white;max-width:140px}button:disabled{opacity:.55;cursor:wait}.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}.busy{opacity:.75}select{padding:9px;border-radius:7px;background:#101827;color:white;border:1px solid #53637c}button{padding:11px 18px;border:0;border-radius:8px;background:#5b91fa;color:#081425;font-weight:700;cursor:pointer;margin:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#b9cbe6}small{color:#9fb1cb}.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.info-card{padding:15px;background:#142033;border:1px solid #354861;border-radius:12px}.info-card .metric{font-size:24px;font-weight:750;margin:7px 0}.info-card .caption{color:#9fb1cb;font-size:13px}.battery-track{height:12px;background:#354861;border-radius:20px;overflow:hidden;margin:12px 0}.battery-fill{height:100%;width:0;background:#65c99b;transition:width .3s}.info-details{color:#b9cbe6;font-size:14px;line-height:1.7;margin-top:14px}.info-details span{display:inline-block;margin-right:16px}.settings-group{border:1px solid #40516b;border-radius:10px;padding:12px 16px;margin:12px 0;background:#142033}.settings-group summary{cursor:pointer;font-weight:700;font-size:17px;padding:5px 0}.settings-group summary::marker{color:#79aaff}.settings-hint{font-size:13px;color:#9fb1cb;line-height:1.5;margin:10px 0 14px}.settings-group label:last-child{margin-bottom:4px}.settings-subgroup{border:1px solid #344763;border-radius:9px;padding:12px 14px;margin:12px 0;background:#101c2e}.settings-subgroup summary{font-size:15px;font-weight:650;cursor:pointer}.settings-dependent[hidden]{display:none!important}.settings-toggle{padding:5px 0 10px}
</style></head><body><h1>Proxmox Power Manager</h1><p><small>Настройки питания · режим сна отключён до вашего подтверждения</small></p><section id="login-panel"><h2>Вход</h2><label>Имя пользователя <input id="username" autocomplete="username" value="admin"></label><label>Пароль <input id="password" type="password" autocomplete="current-password"></label><button id="login">Войти</button><pre id="login-error"></pre></section><div id="dashboard" hidden><section><div class="toolbar"><button id="refresh">Обновить</button><button id="logout">Выйти</button></div><h2>Info</h2><div id="status" role="status" aria-live="polite">Загрузка...</div></section><section><h2>Настройки</h2><p><small>Нажми на название раздела, чтобы свернуть или раскрыть его.</small></p><div id="settings"></div><button id="save">Сохранить</button><pre id="message" role="status" aria-live="polite"></pre></section><section><h2>Симулятор питания</h2><p><small>Только прогноз. Не меняет реальные настройки и не останавливает контейнеры.</small></p><label>Электросеть <select id="sim-ac"><option value="false">Отключена</option><option value="true">Подключена</option></select></label><label>Батарея, % <input id="sim-battery" type="number" min="0" max="100" value="25"></label><label>Симулировать включённую автоматизацию <input id="sim-enabled" type="checkbox" checked></label><label>Симулировать запись восстановления <input id="sim-recovery" type="checkbox"></label><button id="dry">Запустить симуляцию</button><pre id="simulation" role="status" aria-live="polite"></pre></section></div><script src="/app.js"></script></body></html>
